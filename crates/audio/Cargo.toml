[package]
name = "audio"
version = "0.1.0"
edition = "2024"
description = "no_std audio building blocks: sample formats, resampling, mixing, WAV, tones, and HD Audio codec path selection"

[lib]
path = "src/lib.rs"

[dependencies]
nanomp3 = { version = "0.1.1", optional = true }

[features]
# MP3 decoding (userland players; the kernel does not need it).
mp3 = ["dep:nanomp3"]
