[package]
name = "nettools"
version = "0.1.0"
edition = "2024"

[dependencies]
rustos-rt.workspace = true
embedded-tls = { version = "0.19", default-features = false, features = ["alloc", "rsa", "p384"] }
embedded-io = "0.7"
rand_core = "0.6"
# No SSE in userland either: portable SHA-2.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
