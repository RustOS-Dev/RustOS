[package]
name = "create-image"
version = "0.1.0"
edition = "2021"
description = "Host-side tool that wraps the RustOS kernel ELF into a bootable UEFI disk image"

[[bin]]
name = "create-image"
path = "src/main.rs"

[dependencies]
bootloader = { version = "0.11", features = ["uefi"] }
gpt = "4"
uuid = "1"
fat-format = { path = "../fat-format" }
