name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-image:
    name: Build Bootable UEFI Disk Image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install port build tools (the desktop ports; docs/PORTING.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl python3 g++ cmake ninja-build meson gperf bison flex \
            pkg-config libexpat1-dev libffi-dev hwdata python3-mako python3-yaml python3-ply \
            glslang-tools spirv-tools llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev \
            libllvmspirvlib-18-dev

      # The image write_to_drive.sh builds: the desktop (eDEX-DE on labwc,
      # docs/DESKTOP.md) in the initramfs, Linux drivers in the kernel.
      - name: Build the desktop ports
        run: tools/release-ports.sh

      - name: Build kernel
        run: cargo build --release --features linux-drivers,linux-gpu

      - name: Locate kernel ELF
        id: kernel
        run: |
          ELF=$(find target -path "*/release/rustos" -not -name "*.d" | head -1)
          echo "elf=$ELF" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build UEFI disk image
        run: |
          KERNEL_ABS="$(pwd)/${{ steps.kernel.outputs.elf }}"
          OUTPUT_ABS="$(pwd)/rustos-${{ steps.tag.outputs.tag }}.img"
          cd crates/create-image
          cargo run --release -- "$KERNEL_ABS" "$OUTPUT_ABS"

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustos-img
          path: rustos-${{ steps.tag.outputs.tag }}.img

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RustOS ${{ steps.tag.outputs.tag }}
          body: |
            ## RustOS ${{ steps.tag.outputs.tag }}

            ### Download
            - **`rustos-${{ steps.tag.outputs.tag }}.img`** — UEFI bootable x86_64 disk image (GPT + EFI System Partition)

            ### Flashing to USB (recommended)

            Use the provided helper script to automatically download and flash this release:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/0xnullsect0r/RustOS/main/write_to_drive.sh | bash -s -- --drive /dev/sdX
            ```

            Or download and run it manually:

            ```bash
            ./write_to_drive.sh --drive /dev/sdX
            ```

            Replace `/dev/sdX` with your USB device (e.g. `/dev/sdb`). **Do NOT use a partition** (e.g. `/dev/sdb1`).

            **Windows (Rufus):** Open Rufus, select the `.img` file, choose "DD image" mode.

            Ensure your system is set to boot in **UEFI mode** (not Legacy/CSM). CSM/legacy BIOS is no longer required.

            ### Testing in QEMU (UEFI)

            Install OVMF firmware first:
            ```bash
            sudo apt-get install ovmf        # Debian/Ubuntu
            sudo pacman -S edk2-ovmf         # Arch
            brew install qemu                # macOS (bundles OVMF)
            ```

            Then run:
            ```bash
            qemu-system-x86_64 \
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd \
              -drive format=raw,file=rustos-${{ steps.tag.outputs.tag }}.img \
              -device qemu-xhci,id=xhci \
              -drive if=none,id=usbdisk,file=YOUR_FAT32_DISK.img,format=raw \
              -device usb-storage,bus=xhci.0,drive=usbdisk \
              -serial stdio
            ```

            ### What's in this release
            - **UEFI bootloader** — boots on any modern UEFI system without CSM/legacy mode
            - Userspace `rsh` shell (`/bin/rsh`) launched by the kernel at boot
            - ELF64 process loader — run programs from USB with `exec /usb/yourprogram`
            - USB mass storage (XHCI) — plug in a USB drive and run `usbscan` to mount it at `/usb`
            - FAT32 read support for USB drives
            - VGA text mode, async keyboard input
            - Heap allocator, interrupt handling (IDT/GDT/PIC)
          files: rustos-${{ steps.tag.outputs.tag }}.img
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
