[package]
name = "nettls"
version = "0.1.0"
license = "GPL-2.0-or-later"
edition = "2021"
description = "TLS 1.2/1.3 client for RustOS: rustls with a pure-Rust (RustCrypto) provider, CA bundles, blocking streams"

[lib]
path = "src/lib.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
pki-types = { package = "rustls-pki-types", version = "1", default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "alloc"] }
p384 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
rand_core = { version = "0.6", default-features = false }
signature = { version = "2", default-features = false }

[dev-dependencies]
# The in-memory test server uses rustls's buffered (std) API.
rustls = { version = "0.23", default-features = false, features = ["tls12", "std"] }

# Big-number and elliptic-curve code is very slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
