[package]
name = "wlan"
version = "0.1.0"
license = "GPL-2.0-or-later"
edition = "2024"
description = "no_std IEEE 802.11 station logic: frames, IEs, RSN, WPA2-PSK and WPA3-SAE supplicant"

[lib]
path = "src/lib.rs"

[dependencies]
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = { version = "0.8", default-features = false }
cmac = { version = "0.7", default-features = false }
aes-kw = { version = "0.2", default-features = false, features = ["alloc"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "expose-field"] }
subtle = { version = "2", default-features = false }
hkdf = { version = "0.12", default-features = false }
