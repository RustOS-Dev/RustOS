[package]
name = "rustos"
version = "0.1.0"
license = "GPL-2.0-or-later"
authors = ["RustOS Contributors"]
edition = "2024"

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[features]
# LinuxKPI: compile Linux drivers into the kernel (needs clang 15+).
# See docs/ROADMAP-ROUND4.md.
linuxkpi = []
linux-e1000 = ["linuxkpi"]
# Test-only Linux driver /dev/kpi-test (src/linuxkpi/c/testdev.c).
linux-test = ["linuxkpi"]
# Linux Wi-Fi stack: generic netlink, cfg80211, mac80211.
linux-wifi = ["linuxkpi"]
# Simulated radios for testing the Wi-Fi stack.
linux-hwsim = ["linux-wifi"]
# MediaTek MT7921/MT7921K/MT7920/MT7922 PCIe Wi-Fi (Linux mt76).
linux-mt7921 = ["linux-wifi"]
# The Linux drivers release images ship (write_to_drive.sh builds with it).
linux-drivers = ["linux-mt7921"]

[dependencies]
bootloader_api = "0.11"
spin = "0.9"
x86_64 = { version = "0.14.13", default-features = false, features = ["instructions", "const_fn", "abi_x86_interrupt"] }
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
acpi = "6.1"
log = "0.4"
usb-desc = { path = "crates/usb-desc" }
wlan = { path = "crates/wlan" }
netproto = { path = "crates/netproto" }
ext4-core = { path = "crates/ext4-core" }
audio = { path = "crates/audio" }
bt = { path = "crates/bt" }
# The kernel runs without SSE: force the portable crypto backends.
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[dependencies.smoltcp]
version = "0.14"
default-features = false
features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "socket-raw",
    "auto-icmp-echo-reply",
]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "rustos"
test = true
bench = false

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

# WPA2 key derivation and WPA3-SAE group math are slow unoptimized; keep
# them fast in debug kernels too.
# Light optimisation for the kernel itself: unoptimised packet and
# 802.11 paths are too slow under QEMU's emulation for Wi-Fi handshakes
# (wifi-hwsim) to meet their timeouts.
[profile.dev]
opt-level = 1
[profile.dev.package.smoltcp]
opt-level = 3
[profile.dev.package.wlan]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ext4-core]
opt-level = 3

# acpi 6.1.1 with its AML panics (todo!/panic!/unimplemented!) turned into
# AmlError::LibUnimplemented: firmware AML it cannot handle must not stop boot.
[patch.crates-io]
acpi = { path = "third_party/acpi" }
