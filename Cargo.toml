[package]
name = "rustos"
version = "0.1.0"
authors = ["RustOS Contributors"]
edition = "2024"

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[dependencies]
bootloader_api = "0.11"
spin = "0.9"
x86_64 = { version = "0.14.13", default-features = false, features = ["instructions", "const_fn", "abi_x86_interrupt"] }
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
acpi = "6.1"
log = "0.4"
usb-desc = { path = "crates/usb-desc" }

[dependencies.smoltcp]
version = "0.14"
default-features = false
features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "socket-raw",
    "auto-icmp-echo-reply",
]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "rustos"
test = true
bench = false

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false
