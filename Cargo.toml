[package]
name = "rustos"
version = "0.1.0"
license = "GPL-2.0-or-later"
authors = ["RustOS Contributors"]
edition = "2024"

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[features]
# LinuxKPI: compile Linux drivers into the kernel (needs clang 15+).
# See docs/ROADMAP-ROUND4.md.
linuxkpi = []
linux-e1000 = ["linuxkpi"]
# Test-only Linux driver /dev/kpi-test (src/linuxkpi/c/testdev.c).
linux-test = ["linuxkpi"]
# Linux Wi-Fi stack: generic netlink, cfg80211, mac80211.
linux-wifi = ["linuxkpi"]
# Simulated radios for testing the Wi-Fi stack.
linux-hwsim = ["linux-wifi"]
# Linux USB drivers on RustOS's xHCI driver (the LinuxKPI USB core).
linux-usb = ["linuxkpi"]
# Linux USB networking instead of the native CDC ECM/RNDIS driver: usbnet
# with CDC ECM/NCM, RNDIS, r8152, ASIX and iPhone tethering.
linux-usbnet = ["linux-usb", "linux-phy"]
# Linux USB serial adapters (FTDI, CP210x, CH341, PL2303, option modems) and
# CDC ACM devices as RustOS terminals (/dev/ttyUSB*, /dev/ttyACM*).
linux-serial = ["linux-usb"]
# Linux input core and HID (generic, multitouch, HID over I2C for laptop
# touchpads); Linux input devices become RustOS ones.
linux-hid = ["linux-i2c"]
# Linux USB HID instead of the native USB HID driver (tests the Linux HID
# path on QEMU's USB keyboard and tablet).
linux-usbhid = ["linux-hid", "linux-usb"]
# ACPI I2C controllers and AMD GPIO for I2C-HID touchpads (M33).
linux-platform = ["linux-hid"]
# USB webcams: V4L2, videobuf2, media controller and uvcvideo (M33).
linux-video = ["linux-usb", "linux-i2c"]
# Linux sound: ALSA with OSS emulation, Intel HDA and USB audio, in place
# of the native HDA and USB audio drivers (M34). USB audio reports to the
# media controller, hence linux-video.
linux-sound = ["linux-usb", "linux-video", "linux-hid"]
# DRM core and KMS helpers (M35); drivers are features of their own.
linux-drm = ["linuxkpi"]
linux-drm-sysfb = ["linux-drm"]
linux-drm-bochs = ["linux-drm"]
linux-drm-virtio = ["linux-drm"]
# AMD GPUs through Linux amdgpu (M38): compiled, untested on hardware.
linux-drm-amd = ["linux-drm", "linux-i2c"]
# GPU drivers in release images (write_to_drive.sh): opt-in at boot with
# kernel.conf linux.enable=<driver> until they have run on hardware.
# NVIDIA GPUs through Linux nouveau (M39): compiled, untested on hardware.
linux-drm-nouveau = ["linux-drm", "linux-i2c"]
# Intel GPUs through Linux i915 (M40): compiled, untested on hardware.
linux-drm-i915 = ["linux-drm", "linux-i2c"]
# Intel Xe2 GPUs through Linux xe, without display (M40): compiled only.
linux-drm-xe = ["linux-drm", "linux-i2c"]
linux-gpu = ["linux-drm-amd", "linux-drm-nouveau", "linux-drm-i915"]
# SD/MMC cards on SDHCI hosts (PCI, ACPI) with Linux's MMC core: mmcblkN.
linux-mmc = ["linuxkpi"]
# Linux I2C core (adapters, ACPI-enumerated clients, bit-banging).
linux-i2c = ["linuxkpi"]
# Linux PHY library and MDIO bus (phylink, the Realtek PHY driver).
linux-phy = ["linuxkpi"]
# Linux PCIe Ethernet drivers for hardware the native drivers do not
# cover: igb, e1000e, igc, alx, tg3, atlantic, r8169 (with phylib).
linux-eth = ["linux-i2c", "linux-phy"]
# MediaTek MT7921/MT7921K/MT7920/MT7922 Wi-Fi (Linux mt76): PCIe, and the
# MT7921AU USB adapters.
linux-mt7921 = ["linux-wifi", "linux-usb"]
# The Linux drivers release images ship (write_to_drive.sh builds with it).
linux-drivers = ["linux-mt7921", "linux-eth", "linux-usbnet", "linux-serial", "linux-mmc", "linux-hid", "linux-platform", "linux-video", "linux-sound", "linux-drm-sysfb", "linux-drm-bochs", "linux-drm-virtio"]

[dependencies]
bootloader_api = "0.11"
spin = "0.9"
x86_64 = { version = "0.14.13", default-features = false, features = ["instructions", "const_fn", "abi_x86_interrupt"] }
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
acpi = "6.1"
log = "0.4"
usb-desc = { path = "crates/usb-desc" }
wlan = { path = "crates/wlan" }
netproto = { path = "crates/netproto" }
ext4-core = { path = "crates/ext4-core" }
audio = { path = "crates/audio" }
bt = { path = "crates/bt" }
# The kernel runs without SSE: force the portable crypto backends.
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[dependencies.smoltcp]
version = "0.14"
default-features = false
features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "socket-raw",
    "auto-icmp-echo-reply",
]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "rustos"
test = true
bench = false

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

# WPA2 key derivation and WPA3-SAE group math are slow unoptimized; keep
# them fast in debug kernels too.
# Light optimisation for the kernel itself: unoptimised packet and
# 802.11 paths are too slow under QEMU's emulation for Wi-Fi handshakes
# (wifi-hwsim) to meet their timeouts.
[profile.dev]
opt-level = 1
[profile.dev.package.smoltcp]
opt-level = 3
[profile.dev.package.wlan]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ext4-core]
opt-level = 3

# acpi 6.1.1 with its AML panics (todo!/panic!/unimplemented!) turned into
# AmlError::LibUnimplemented: firmware AML it cannot handle must not stop boot.
[patch.crates-io]
acpi = { path = "third_party/acpi" }
