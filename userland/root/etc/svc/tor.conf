# Tor client (ports/tor). Its configuration is written by eDEX-DE's
# edex-tor-mode: /storage/etc/tor/torrc, or /etc/tor/torrc without a
# storage partition.
description=Tor anonymity daemon
exec=f=/storage/etc/tor/torrc; [ -r "$f" ] || f=/etc/tor/torrc; exec /usr/local/bin/tor -f "$f"
restart=on-failure
