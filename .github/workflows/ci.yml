name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        env:
          RUSTOS_PORTS: "0" # busybox/curl/QuickJS are built by the test job
        run: cargo check

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo clippy
        run: cargo clippy -- -D warnings

  host-crates:
    name: Host crate tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo test (crates/*)
        run: |
          for c in crates/fat-format crates/usb-desc crates/wlan crates/weburl crates/http crates/nettls crates/netproto crates/html crates/textlayout crates/unixcrypt crates/ext4-core; do
            (cd "$c" && cargo test)
          done
      - name: Firmware provisioning (write_to_drive.sh)
        run: tools/test-firmware-install.sh

  test:
    name: Integration Tests (QEMU + UEFI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Cache port sources and test262
        uses: actions/cache@v4
        with:
          path: target/ports/src
          key: ports-src-${{ hashFiles('ports/*/build.sh', 'tools/fetch-test262.sh', 'tests/test262.list') }}
          restore-keys: ports-src-

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          # e2fsprogs: ext2/ext4 test disks; openssl + python3: HTTPS test
          # server; gcc: dynamic-linking test programs
          sudo apt-get install -y qemu-system-x86 ovmf e2fsprogs curl openssl python3 gcc

      - name: Make runner script executable
        run: chmod +x run-qemu-uefi.sh

      - name: Run tests
        env:
          RUSTOS_TEST_TIMEOUT: "600"
        run: cargo test

      - name: Boot scenarios (drive the shell over the serial console)
        run: |
          cargo build
          tools/run-scenarios.sh
          # USB tethering over RNDIS (QEMU usb-net's second configuration)
          RUSTOS_USB_PREFER_RNDIS=1 cargo build
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/eth-usb.txt

      - name: Boot scenarios on 4 CPUs
        run: |
          cargo build
          RUSTOS_SMP=4 tools/run-scenarios.sh
