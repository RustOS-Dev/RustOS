[unstable]
json-target-spec = true
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "x86_64-rustos.json"

[target.'cfg(target_os = "none")']
runner = "./run-qemu-uefi.sh"
# No SSE in the kernel: use the table-free software AES.
rustflags = ["--cfg", "aes_force_soft"]

[env]
# smoltcp compile-time limits: addresses and routes per interface.
SMOLTCP_IFACE_MAX_ADDR_COUNT = "6"
SMOLTCP_IFACE_MAX_ROUTE_COUNT = "16"
SMOLTCP_IFACE_NEIGHBOR_CACHE_COUNT = "32"
