[package]
name = "httpc"
version = "0.1.0"
edition = "2021"
description = "no_std HTTP/1.1 client: messages, chunked/gzip bodies, cookies, redirects, forms"

[lib]
path = "src/lib.rs"

[dependencies]
weburl = { path = "../weburl" }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
