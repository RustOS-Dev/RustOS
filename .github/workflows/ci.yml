name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        env:
          RUSTOS_PORTS: "0" # busybox/curl/QuickJS are built by the test job
        run: cargo check

      - name: cargo build --features linuxkpi (Linux C through LinuxKPI)
        env:
          RUSTOS_PORTS: "0"
          RUSTOS_SKIP_USERLAND: "1"
        run: |
          clang --version
          cargo build --features linuxkpi
          tools/linux-import.py check

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo clippy
        run: |
          cargo clippy -- -D warnings
          # Feature builds compile Rust that the default build leaves out.
          cargo clippy --features linux-hwsim,linux-drivers,linux-e1000,linux-test -- -D warnings

  host-crates:
    name: Host crate tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo test (crates/*)
        run: |
          for c in crates/fat-format crates/usb-desc crates/wlan crates/weburl crates/http crates/nettls crates/netproto crates/html crates/css crates/layout crates/jsproto crates/paint crates/unixcrypt crates/ext4-core crates/audio crates/bt; do
            (cd "$c" && cargo test)
          done
          (cd crates/audio && cargo test --features mp3)
          python3 tools/fake-hci.py --selftest
      - name: Firmware provisioning (write_to_drive.sh)
        run: tools/test-firmware-install.sh

  test:
    name: Integration Tests (QEMU + UEFI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Cache port sources and test262
        uses: actions/cache@v4
        with:
          path: target/ports/src
          key: ports-src-${{ hashFiles('ports/*/build.sh', 'tools/fetch-test262.sh', 'tests/test262.list') }}
          restore-keys: ports-src-

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          # e2fsprogs: ext2/ext4 test disks; openssl + python3: HTTPS test
          # server; gcc: dynamic-linking test programs
          sudo apt-get install -y qemu-system-x86 ovmf e2fsprogs curl openssl python3 gcc fonts-dejavu-core

      - name: Make runner script executable
        run: chmod +x run-qemu-uefi.sh

      - name: Run tests
        env:
          RUSTOS_TEST_TIMEOUT: "600"
        run: cargo test

      - name: jsd end-to-end tests (host build of jsd)
        run: |
          cargo build
          sh userland/jsd/host-build.sh "$PWD/target/ports/build/quickjs/rquickjs-sys-0.14.0/quickjs" "$PWD/target/jsd-host"
          (cd crates/jsproto && JSD_BIN="$PWD/../../target/jsd-host/jsd" cargo test --test jsd)

      - name: Boot scenarios (drive the shell over the serial console)
        run: |
          cargo build
          tools/run-scenarios.sh
          # USB tethering over RNDIS (QEMU usb-net's second configuration)
          RUSTOS_USB_PREFER_RNDIS=1 cargo build
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/eth-usb.txt

      - name: Boot scenarios on 4 CPUs
        run: |
          cargo build
          RUSTOS_SMP=4 tools/run-scenarios.sh

      - name: Linux drivers through LinuxKPI (Linux e1000, test driver; 2 and 4 CPUs)
        run: |
          cargo build --features linux-e1000,linux-test
          S="tests/scenarios/linux/eth-linux-e1000.txt tests/scenarios/linux/linuxkpi-chrdev.txt"
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos $S
          RUSTOS_SMP=4 tools/run-scenarios.sh target/x86_64-rustos/debug/rustos $S
      - name: Linux 802.11 stack (cfg80211, mac80211, mac80211_hwsim) with hostapd and wpa_supplicant
        run: |
          cargo build --features linux-hwsim
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/wifi-hwsim.txt tests/scenarios/linux/wifi-hwsim-eap.txt
      - name: Linux USB networking (usbnet, cdc_ether, rndis_host) on the LinuxKPI USB core
        run: |
          cargo build --features linux-usbnet
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/eth-usb-linux.txt
          RUSTOS_SMP=4 tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/eth-usb-linux.txt
          RUSTOS_USB_PREFER_RNDIS=1 cargo build --features linux-usbnet
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/eth-usb-linux-rndis.txt
      - name: Linux Ethernet drivers (igb on QEMU's 82576; e1000e, igc, alx, tg3, atlantic, r8169 compiled)
        run: |
          cargo build --features linux-eth
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/eth-igb.txt
          RUSTOS_SMP=4 tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/eth-igb.txt
      - name: Linux USB serial (usb-serial + ftdi_sio) on RustOS terminals
        run: |
          cargo build --features linux-serial
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/usb-serial.txt
      - name: Linux SD/MMC (MMC core, sdhci-pci) with an SD card
        run: |
          cargo build --features linux-mmc
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/sdcard.txt
      - name: ACPI platform devices and IRQ domains (acpi-platform)
        run: |
          cargo build --features linux-platform
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/acpi-platform.txt
      - name: Linux sound (audio-linux)
        run: |
          cargo build --features linux-sound
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/audio-linux.txt
      - name: Linux DRM on QEMU's standard VGA (drm-bochs)
        run: |
          cargo build --features linux-drm-bochs
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/drm-bochs.txt
      - name: Linux usbhid and input core (usb-hid-linux)
        run: |
          cargo build --features linux-usbhid
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/linux/usb-hid-linux.txt
      - name: Native drivers keep their devices in the release driver set
        run: |
          cargo build --features linux-drivers
          tools/run-scenarios.sh target/x86_64-rustos/debug/rustos tests/scenarios/eth-e1000.txt tests/scenarios/eth-e1000e.txt tests/scenarios/eth-usb.txt tests/scenarios/usb.txt
      - name: Release driver set (linux-drivers, as write_to_drive.sh builds it)
        run: cargo build --release --features linux-drivers
