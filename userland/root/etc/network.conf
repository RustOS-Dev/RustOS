# Network configuration, applied at boot by `ifup -a`.
# A copy in /storage/etc/network.conf (the persistent partition) wins.
#
#   IFACE dhcp
#   IFACE static ADDRESS/PREFIX [GATEWAY] [DNS...]
#   IFACE down
#
# Interfaces not listed use DHCP. Examples:
#   eth0 dhcp
#   eth1 static 192.168.1.50/24 192.168.1.1 1.1.1.1 9.9.9.9
